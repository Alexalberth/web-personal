<article class="proyecto" id="{{slug}}" data-area="{{areaSlug}}" data-herramientas="{{herramientasSlug}}" style="view-transition-name: proyecto-{{slug}}">
  <p class="proyecto-area">{{area}}<span class="proyecto-anio">{{anio}}</span></p>
  <div class="proyecto-cuerpo">
    <h{{nivel}} class="proyecto-titulo">{{titulo}}</h{{nivel}}>
    <dl class="proyecto-detalle">
      <div class="proyecto-problema"><dt>Problema</dt><dd>{{problema}}</dd></div>
      <div class="proyecto-enfoque"><dt>Cómo lo abordé</dt><dd>{{enfoque}}</dd></div>
      <div class="proyecto-resultado"><dt>Resultado</dt><dd>{{resultado}}</dd></div>
    </dl>
    {{{notaHtml}}}
    {{{herramientas}}}
  </div>
</article>
